<body>

    <nav class="navbar navbar-light bg-light px-3 d-flex justify-content-between">

        <div class="d-flex align-items-center gap-4">
            <img src="https://tse1.mm.bing.net/th/id/OIP.5WSICICiTVykB7rQHR2ApAHaHa?w=2000&h=2000&rs=1&pid=ImgDetMain&o=7&rm=3" width="40">

            <button type="button" data-bs-toggle="modal" data-bs-target="#logoutModal" class="navbar-btn" >Log out</button>

    </nav>


<div class="main-layout">

    <aside class="sidebar">
        <h5>Secciones</h5>

        <ul class="sidebar-menu">
            <li class="category-filter active" data-category="Todas">Todas</li>
            <li class="category-filter" data-category="Software">Software</li>
            <li class="category-filter" data-category="Sistemas">Sistemas</li>
            <li class="category-filter" data-category="Ciberseguridad">Ciberseguridad</li>
            <li class="category-filter" data-category="IA">IA</li>
        </ul>
    </aside>

    <main class="content">

        <div class="search-bar-container">
            <input id="searchInput" type="text" class="form-control search-bar" placeholder="Buscar publicaciones...">
        </div>

        <div id="postsContainer">
            <p class="empty-message">Cargando publicaciones...</p>
        </div>

    </main>

</div>

    <div class="modal fade" id="logoutModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Cerrar sesión</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                ¿Seguro que quieres cerrar sesión?
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                    Cancelar
                </button>

                <button id="logoutBtn" type="button" class="navbar-btn">
                    Cerrar sesión
                </button>
            </div>

            </div>
        </div>
    </div>
        



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.min.js"></script>

    <script id="loadMoreComments">
        document.querySelectorAll(".comments-section").forEach(section => {
            const comments = section.querySelectorAll(".comment");
            const button = section.querySelector(".show-more-btn");

            let visibleCount = 2;

            // Oculta todos menos los primeros 2
            comments.forEach((comment, index) => {
                if (index >= visibleCount) {
                    comment.classList.add("hidden");
                }
            });

            button.addEventListener("click", () => {
                let shown = 0;

                comments.forEach(comment => {
                    if (comment.classList.contains("hidden") && shown < 2) {
                        comment.classList.remove("hidden");
                        shown++;
                    }
                });

                const remaining = [...comments].some(c => c.classList.contains("hidden"));
                if (!remaining) {
                    button.style.display = "none";
                }
            });
        });
    </script>

    <script src="js/foro.js"></script>


</body>

</html>
