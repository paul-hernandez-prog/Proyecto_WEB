<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Amigos</title>
    <style>


    </style>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.snow.css" rel="stylesheet">
    <link rel="stylesheet" href="css/amigos.css">

    <script 
        src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.9.10/dist/dotlottie-wc.js" 
        type="module">
    </script>

</head>  

<body>

    <nav class="navbar navbar-light bg-light px-3 d-flex justify-content-between">

        <div class="d-flex align-items-center gap-4">
            <img 
                id="navbarProfileImg"
                class="navbar-profile-img"
                src="https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_1280.png"
                alt="Foto de perfil"
            >
    
            <a href="perfil.html" class="text-decoration-none text-dark">Tu perfil</a>
            <a href="amigos.html" class="text-decoration-none text-dark">Amigos</a>
            <a href="foro.html" class="text-decoration-none text-dark">Foro</a>

        </div>

        <div class="d-flex align-items-center gap-3">
            <button type="button" data-bs-toggle="modal" data-bs-target="#logoutModal" class="navbar-btn" >Log out</button>
        </div>

    </nav>

    <div class="main-layout">

    <aside class="sidebar">
        <h5>Secciones</h5>

        <ul id="categorySidebar" class="sidebar-menu">
            <li class="category-filter active" data-category="Todas">Todas</li>
        </ul>

    </aside>

    <main class="content">

        <div class="search-bar-container">
            <input id="searchInput" type="text" class="form-control search-bar" placeholder="Buscar publicaciones...">
        </div>

    <div id="postsContainer">
        <div class="loader-box">
            <dotlottie-wc 
                src="https://lottie.host/de7aedbd-e205-45c9-af29-0516f6840a7e/YB2SDQ2xC9.lottie"
                style="width: 120px; height: 120px"
                autoplay 
                loop>
            </dotlottie-wc>

            <p>Cargando publicaciones...</p>
        </div>
    </div>

    </main>

    <div class="modal fade" id="logoutModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Cerrar sesión</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                ¿Seguro que quieres cerrar sesión?
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                    Cancelar
                </button>

                <button id="logoutBtn" type="button" class="navbar-btn">
                    Cerrar sesión
                </button>
            </div>

            </div>
        </div>
    </div>

    <div class="modal fade" id="reportModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">

            <form id="reportForm">

                <div class="modal-header">
                    <h5 class="modal-title">Reportar contenido</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">

                    <input type="hidden" id="reportTipo">
                    <input type="hidden" id="reportPostId">
                    <input type="hidden" id="reportCommentId">

                    <div class="mb-3">
                        <label class="form-label">Motivo</label>
                        <select id="reportMotivo" class="form-select" required>
                            <option value="">Selecciona un motivo</option>
                            <option value="Spam">Spam</option>
                            <option value="Ofensivo">Ofensivo</option>
                            <option value="Información falsa">Información falsa</option>
                            <option value="Acoso">Acoso</option>
                            <option value="Otro">Otro</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Descripción</label>
                        <textarea 
                            id="reportDescripcion" 
                            class="form-control" 
                            rows="3"
                            placeholder="Explica brevemente el problema"
                        ></textarea>
                    </div>

                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Cancelar
                    </button>

                    <button type="submit" class="btn btn-danger">
                        Enviar reporte
                    </button>
                </div>

            </form>

        </div>
    </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.min.js"></script>


    <script>
        window.POSTS_API = "/api/posts/following/feed"; 
    </script>

    <script src="js/loader.js"></script>

    <script>
    (() => {
        const DEFAULT_PROFILE_PHOTO_NAV = "https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_1280.png";
        const savedUser = JSON.parse(localStorage.getItem("user"));
        const navbarProfileImg = document.getElementById("navbarProfileImg");

        if (navbarProfileImg && savedUser) {
            navbarProfileImg.src = savedUser.fotoPerfil || DEFAULT_PROFILE_PHOTO_NAV;
        }
    })();
</script>

    <script src="js/foro.js"></script>


</body>

</html>
