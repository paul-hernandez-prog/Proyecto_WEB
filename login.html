<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">

</head>
<body>

<nav class="navbar navbar-light bg-light px-3 d-flex justify-content-between">

    <a class="navbar-brand d-flex align-items-center gap-2" href="#">
        <img src="https://tse1.mm.bing.net/th/id/OIP.5WSICICiTVykB7rQHR2ApAHaHa?w=2000&h=2000&rs=1&pid=ImgDetMain&o=7&rm=3" width="40">
        <span class="fw-bold">Foro Estudiantil</span>
    </a>

    <div class="d-flex align-items-center gap-3">
        <a href="about.html" class="text-decoration-none text-dark">About Us</a>
        <button type="button" id="toggle-btn" class="navbar-btn">Sign Up</button>
    </div>

</nav>

<div class="main">
<div class="login-container">

<form id="form" action="">
    <h2 id="form-title">Iniciar Sesión</h2>

    <div class="form-group"><input type="text" id="nombre" placeholder="Nombre" style="display:none;"></div>
    

    <div class="form-group"><input type="text" id="apellido" placeholder="Apellido" style="display:none;"></div>
    

    <div class="form-group"><input type="email" id="correo" placeholder="Correo"></div>
    

    <div class="form-group"><input type="password" id="password" placeholder="Contraseña" required></div>
    

    <div class="form-group"><input type="password" id="confirmar" placeholder="Confirmar contraseña" style="display:none;"></div>
    

    <button type="submit" class="login-btn" id="submit-btn">Entrar</button>

    <button type="button" id="admin-btn" class="login-btn">
        Iniciar como administrador
    </button>

</form>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
