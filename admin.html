<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">

</head>

<body>

        <nav class="navbar navbar-light bg-light px-3 d-flex justify-content-between">

        <div class="d-flex align-items-center gap-4">
            <img src="https://tse1.mm.bing.net/th/id/OIP.5WSICICiTVykB7rQHR2ApAHaHa?w=2000&h=2000&rs=1&pid=ImgDetMain&o=7&rm=3" width="40">
    
            <a href="perfil.html" class="text-decoration-none text-dark">Tu perfil</a>
            <a href="amigos.html" class="text-decoration-none text-dark">Amigos</a>
            <a href="foro.html" class="text-decoration-none text-dark">Foro</a>

        </div>

        <div class="d-flex align-items-center gap-3">
            
            <button type="button" data-bs-toggle="modal" data-bs-target="#logoutModal" class="navbar-btn" >Log out</button>
        </div>

    </nav>


    <div class="admin-container">

        <h2 class="mb-4 text-white">Administrar Categorías</h2>

        <ul class="list-group mb-4">

            <li class="list-group-item d-flex justify-content-between align-items-center">
                Software
                <button class="btn btn-danger btn-sm">Eliminar</button>
            </li>

            <li class="list-group-item d-flex justify-content-between align-items-center">
                Sistemas
                <button class="btn btn-danger btn-sm">Eliminar</button>
            </li>

            <li class="list-group-item d-flex justify-content-between align-items-center">
                Ciberseguridad
                <button class="btn btn-danger btn-sm">Eliminar</button>
            </li>

            <li class="list-group-item d-flex justify-content-between align-items-center">
                IA
                <button class="btn btn-danger btn-sm">Eliminar</button>
            </li>

        </ul>

        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createCategoryModal">
            + Nueva categoría
        </button>

    </div>

    <div class="modal fade" id="createCategoryModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">Crear nueva categoría</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <input type="text" class="form-control" placeholder="Ej: industrial, arquitectura, mario">
                </div>

                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button class="btn btn-primary">Crear</button>
                </div>

            </div>
        </div>
    </div>


        <div class="modal fade" id="logoutModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Cerrar sesión</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                ¿Seguro que quieres cerrar sesión?
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                    Cancelar
                </button>

                <a href="login.html" class="navbar-btn ">
                    Cerrar sesión
                </a>
            </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
